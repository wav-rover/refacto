name: todo

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - api-gateway
    ports:
      - "3000:80"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    environment:
      - PORT=3001
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis
    volumes:
      - project-data:/app/data

  task-service:
    build:
      context: .
      dockerfile: services/task-service/Dockerfile
    environment:
      - PORT=3002
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - TASK_SQLITE_DB_LOCATION=/app/data/task-service.db
    depends_on:
      - redis
    volumes:
      - task-data:/app/data

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      - PORT=3003
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NOTIFICATION_SQLITE_DB_LOCATION=/app/data/notification-service.db
    depends_on:
      - redis
    volumes:
      - notification-data:/app/data

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      - PORT=3004
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis
    volumes:
      - auth-data:/app/data

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      - PORT=3000
      - API_VERSION=v1
      - AUTH_SERVICE_URL=http://auth-service:3004
      - PROJECT_SERVICE_URL=http://project-service:3001
      - TASK_SERVICE_URL=http://task-service:3002
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
      - FRONTEND_ORIGIN=http://localhost:3000
    depends_on:
      - auth-service
      - project-service
      - task-service
      - notification-service
volumes:
  auth-data:
  project-data:
  task-data:
  notification-data:
