sonar.projectKey=wav-rover_refacto
sonar.organization=refacto

# Couverture agrégée des 5 services (lcov produit par Jest --coverage,
# restauré dans services/<svc>/coverage/ par le job sonarcloud de main-quality.yml).
sonar.javascript.lcov.reportPaths=services/auth-service/coverage/lcov.info,services/project-service/coverage/lcov.info,services/task-service/coverage/lcov.info,services/notification-service/coverage/lcov.info,services/api-gateway/coverage/lcov.info

# Évite d'analyser dépendances, builds et rapports de couverture.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
